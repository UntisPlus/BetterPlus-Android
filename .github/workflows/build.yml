name: Build App

on:
  workflow_dispatch:
  pull_request:

# The enabled SSO providers are a build-time flag: ssoProviders= in gradle.properties
# (read into BuildConfig.SSO_ENABLED_PROVIDERS in app/build.gradle.kts). This matrix
# builds both variants with whatever value that property has — keep it as the baseline
# of providers proven to work in the in-app WebView (currently Office 365 only).

jobs:
  build:
    name: Build ${{ matrix.variant }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [ debug, release ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only write to the cache for builds on the default branch.
          # Builds on other branches will only read existing entries from the cache.
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Prepare signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_RELEASE_PASSWORD: ${{ secrets.KEY_RELEASE_PASSWORD }}
          KEY_DEBUG_PASSWORD: ${{ secrets.KEY_DEBUG_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/UntisPlus.jks
          printf 'keystorePassword=%s\nkeyReleasePassword=%s\nkeyDebugPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_RELEASE_PASSWORD" "$KEY_DEBUG_PASSWORD" > app/signing.properties

      - name: Assemble debug APK
        if: ${{ matrix.variant == 'debug' }}
        run: ./gradlew assembleDebug

      - name: Assemble release APK
        if: ${{ matrix.variant == 'release' }}
        run: ./gradlew assembleRelease

      - name: Upload ${{ matrix.variant }} APK
        uses: actions/upload-artifact@v4
        with:
          name: untisplus-${{ matrix.variant }}
          path: |
            app/build/outputs/apk/*/${{ matrix.variant }}/*.apk
            app/build/outputs/apk/*/${{ matrix.variant }}/output-metadata.json
