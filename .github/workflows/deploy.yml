name: Release App

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: Override version (defaults to versionName from app/build.gradle.kts)
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > app/UntisPlus.jks

      - name: Write signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_RELEASE_PASSWORD: ${{ secrets.KEY_RELEASE_PASSWORD }}
          KEY_DEBUG_PASSWORD: ${{ secrets.KEY_DEBUG_PASSWORD }}
        run: |
          printf 'keystorePassword=%s\nkeyReleasePassword=%s\nkeyDebugPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_RELEASE_PASSWORD" "$KEY_DEBUG_PASSWORD" > app/signing.properties

      - name: Determine version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ -n "$VERSION_INPUT" ]]; then
            VERSION="$VERSION_INPUT"
          else
            VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Releasing UntisPlus $VERSION"

      - name: Assemble release APK
        run: ./gradlew assembleRelease

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "UntisPlus-${VERSION}.apk"
          gh release view "$VERSION" --json tagName > /dev/null 2>&1 || \
              gh release create "$VERSION" --title "UntisPlus $VERSION" \
                  --generate-notes --latest
          gh release upload "$VERSION" "UntisPlus-${VERSION}.apk" --clobber
