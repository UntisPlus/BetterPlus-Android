name: Release App

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: Override version (defaults to versionName from app/build.gradle.kts)
        required: false

permissions:
  contents: write

# Released builds use the SSO provider flag from gradle.properties (ssoProviders=
# -> BuildConfig.SSO_ENABLED_PROVIDERS) so only providers proven to work in the app get
# published. Trial builds can override it per-run with a workflow variable if desired.

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > app/UntisPlus.jks

      - name: Write signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_RELEASE_PASSWORD: ${{ secrets.KEY_RELEASE_PASSWORD }}
          KEY_DEBUG_PASSWORD: ${{ secrets.KEY_DEBUG_PASSWORD }}
        run: |
          printf 'keystorePassword=%s\nkeyReleasePassword=%s\nkeyDebugPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_RELEASE_PASSWORD" "$KEY_DEBUG_PASSWORD" > app/signing.properties

      - name: Determine version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ -n "$VERSION_INPUT" ]]; then
            VERSION="$VERSION_INPUT"
          else
            VERSION=$(grep -oP 'versionNameValue = "\K[^"]+' app/build.gradle.kts)
          fi
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not determine version from app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Releasing UntisPlus $VERSION"

      - name: Assemble release APK and bundle
        run: ./gradlew assembleRelease bundleRelease

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "UntisPlus-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk UntisPlus.apk
          gh release view "$VERSION" --json tagName > /dev/null 2>&1 || \
              gh release create "$VERSION" --title "UntisPlus $VERSION" \
                  --generate-notes --latest
          gh release upload "$VERSION" "UntisPlus-${VERSION}.apk" UntisPlus.apk --clobber

      - name: Upload AAB artifact for Play Store
        uses: actions/upload-artifact@v4
        with:
          name: UntisPlus-${{ env.VERSION }}-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Append signing certificate fingerprints to release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          FINGERPRINTS=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep "SHA-256 digest")
          gh release view "$VERSION" --json body --jq .body > body.md
          if grep -q "Signing certificate SHA-256 fingerprints" body.md; then
            echo "Fingerprints already present in release notes"
            exit 0
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "Signing certificate SHA-256 fingerprints:"
            echo '```'
            echo "$FINGERPRINTS"
            echo '```'
          } >> body.md
          gh release edit "$VERSION" --notes-file body.md
